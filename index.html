<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="description" content="Controle profissional de incubação de ovos">
    
    <!-- Ícones SVG embutidos em Base64 para instalação imediata do PWA -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23121212'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='55' font-weight='bold' fill='%23d4af37' text-anchor='middle'%3EIP%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23d4af37'/%3E%3Ctext x='50' y='68' font-family='Arial,sans-serif' font-size='55' font-weight='bold' fill='%23121212' text-anchor='middle'%3EIP%3C/text%3E%3C/svg%3E">
    
    <link rel="manifest" href="manifest.json">
    <title>IncubaPro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header id="app-header">
        <h1 id="header-title">IncubaPro</h1>
        <button id="btn-settings" class="header-btn" aria-label="Configurações">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main id="app-content">
        
        <!-- TELA: INÍCIO -->
        <section id="view-home" class="view active">
            <div class="progress-circle-container">
                <svg class="progress-ring" width="120" height="120">
                    <circle class="progress-ring-bg" cx="60" cy="60" r="54" />
                    <circle id="progress-ring-fill" class="progress-ring-fill" cx="60" cy="60" r="54" />
                </svg>
                <div class="progress-text">
                    <span id="progress-percent">0%</span>
                    <small>Concluído</small>
                </div>
            </div>
            <ul id="timeline-steps" class="timeline"></ul>
        </section>

        <!-- TELA: LOTES -->
        <section id="view-lotes" class="view">
            <button id="btn-add-lote" class="fab-button">+ Novo Lote</button>
            <div id="lotes-list" class="card-list"></div>
        </section>

        <!-- TELA: IA ASSISTENTE -->
        <section id="view-ia" class="view">
            <div id="chat-messages" class="chat-container">
                <div class="chat-msg bot">
                    <p>Olá! Sou o especialista em incubação. Como posso ajudar você hoje?</p>
                </div>
            </div>
            <div class="chat-input-container">
                <input type="text" id="chat-input" placeholder="Digite sua dúvida sobre incubação..." autocomplete="off">
                <button id="btn-send-chat">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </section>

        <!-- TELA: CALENDÁRIO -->
        <section id="view-calendario" class="view">
            <div id="calendar-events" class="card-list"></div>
        </section>

        <!-- TELA: ESPÉCIES -->
        <section id="view-especies" class="view">
            <div class="table-responsive">
                <table id="table-especies">
                    <thead>
                        <tr>
                            <th>Espécie</th>
                            <th>Dias</th>
                            <th>Temp (°C)</th>
                            <th>Umid (%)</th>
                        </tr>
                    </thead>
                    <tbody id="especies-tbody"></tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Menu Inferior -->
    <nav id="bottom-nav">
        <button class="nav-btn active" data-view="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Início</span>
        </button>
        <button class="nav-btn" data-view="lotes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>Lotes</span>
        </button>
        <button class="nav-btn" data-view="ia">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>IA</span>
        </button>
        <button class="nav-btn" data-view="calendario">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Calendário</span>
        </button>
        <button class="nav-btn" data-view="especies">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            <span>Espécies</span>
        </button>
    </nav>

    <!-- Modal Configurações (API Key) -->
    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurações</h2>
                <button class="modal-close" id="close-settings">&times;</button>
            </div>
            <div class="modal-body">
                <p class="settings-desc">Para usar a IA Assistente, insira sua chave da API do Groq.</p>
                
                <div id="api-key-view">
                    <div id="api-key-input-container" class="input-group">
                        <label for="input-api-key">Chave API Groq</label>
                        <input type="password" id="input-api-key" placeholder="gsk_...">
                    </div>
                </div>

                <div id="api-key-active-view" class="api-active-container" style="display: none;">
                    <div class="api-active-badge">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        <span>Chave Ativada ••••••••</span>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="btn-save-api" class="btn-primary">Salvar Chave</button>
                    <button id="btn-remove-api" class="btn-danger" style="display: none;">Remover Chave</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Criar Lote -->
    <div id="modal-lote" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Novo Lote de Ovos</h2>
                <button class="modal-close" id="close-lote">&times;</button>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="lote-nome">Nome do Lote</label>
                    <input type="text" id="lote-nome" placeholder="Ex: Lote Galinha 01">
                </div>
                <div class="input-group">
                    <label for="lote-especie">Espécie</label>
                    <select id="lote-especie">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                
                <div id="custom-species-fields" style="display: none;">
                    <div class="input-group">
                        <label for="custom-name">Nome da Ave</label>
                        <input type="text" id="custom-name" placeholder="Ex: Ema">
                    </div>
                    <div class="input-group-row">
                        <div class="input-group">
                            <label for="custom-days">Dias de Incubação</label>
                            <input type="number" id="custom-days" placeholder="Ex: 28">
                        </div>
                        <div class="input-group">
                            <label for="custom-temp">Temperatura (°C)</label>
                            <input type="number" id="custom-temp" placeholder="Ex: 37.5" step="0.1">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="custom-humid">Umidade (%)</label>
                        <input type="number" id="custom-humid" placeholder="Ex: 60">
                    </div>
                </div>

                <div class="input-group">
                    <label for="lote-qtd">Quantidade de Ovos</label>
                    <input type="number" id="lote-qtd" placeholder="Ex: 12">
                </div>
                <div class="input-group">
                    <label for="lote-data">Data de Início</label>
                    <input type="date" id="lote-data">
                </div>

                <button id="btn-save-lote" class="btn-primary" style="width: 100%; margin-top: 15px;">Criar Lote</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
                </html>
